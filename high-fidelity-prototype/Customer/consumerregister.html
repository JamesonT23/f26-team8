<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as a Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav>
            <div class="navbar">
                <a href="../index.html" class="navbar-brand"><img src="MealPrepMatch.png" width="150" height="150"></a>
                <ul class="nav-links">
                    <li>
                        <a href="../index.html">
                        Home
                        </a>
                    </li>
                    <li>
                        <a href="../login.html" class="btn btn-primary">
                            Login
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <section class="section">

            <div class="container" style="max-width: 600px;">

                <div class="card">

                    <div class="card-body">
                        <h2 class="text-center">
                            Become a MealPrep Match Customer
                        </h2>
                        <p class="text-center text-muted">
                            Register to access the best meal plans from our providers and apply for a subscription.
                        </p>
                        <h3>
                            Personal Information
                        </h3>

                        <div class="form-group">
                            <label for="firstName">
                                First Name
                            </label>
                            <input type="text" id="firstName" placeholder="John" required>
                        </div>

                        <div class="form-group">
                            <label for="lastName">
                                Last Name
                            </label>
                            <input type="text" id="lastName" placeholder="Smith" required>
                        </div>

                        <div class="form-group">
                            <label for="email">
                                Email Address
                            </label>
                            <input type="email" id="email" placeholder="john@example.com" required>
                        </div>
                        <h3>
                            Customer Information
                        </h3>

                        <div class="form-group">
                            <label for="specialties">
                                Dietary Preferences
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                Keto
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                Vegetarian
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                Vegan
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                High Protein
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                Low Carb
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                Low Cholesterol
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                Low Sodium
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                Gluten Free
                            </label>
                        </div>

                        <div class="form-check">
                            <label>
                                <input type="checkbox">
                                Mouse
                            </label>
                        </div>

                        <a href="dashboard.html" class="btn btn-primary register-button">
                            Register as Customer
                        </a>

                        <p class="text-center login-text">
                            Already have an account?
                            <a href="../login.html"
                                style="color: black; font-weight: 500;">Login here!</a>
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
