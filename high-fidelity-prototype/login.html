<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css">
        <title>MealPrep Match - Find your next mealplan!</title>
    <style>



    </style>

</head>
<body>
    <div class="container">
        <nav>
            <div class="navbar">
                <a href="index.html" class="navbar-brand"><img src="MealPrepMatch.png" width="150" height="150"></a>
                <ul class="nav-links">
                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>
                    <li>
                        <a href="login.html" class="btn btn-primary">
                            Login
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

     <section class="section">
      <div class="container" style="max-width: 600px;">
        <div class="card">
          <div class="card-body">
            <h2 class="text-center" >Welcome Back to MealPrep Match</h2>
            <p class="text-center text-muted mb-4">Sign in to your account here.</p>

            <form>
              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                <label style="margin: 0;">
                  <input type="checkbox" style="width: auto; margin-right: 0.5rem;">
                  Remember me
                </label>
                <a href="#" style="color: var(--primary-color); text-decoration: none;">Forgot password?</a>
            </div>

                <a href="../high-fidelity-prototype/Customer/consumerdashboard.html" class="btn btn-primary btn-large" style="width: 100%; margin-top: 1.5rem; display: block; text-align: center;">
                    Sign In as Consumer
                </a>

              <a href="../high-fidelity-prototype/Provider/dashboard.html" class="btn btn-primary btn-large" style="width: 100%; margin-top: 1.5rem; display: block; text-align: center;">
                    Sign In as Chef/Nutritionalist
                </a>
            </form>

            <p class="text-center mt-4">
              Don't have an account? <a href="../high-fidelity-prototype/Customer/consumerregister.html"
                style="color: black; font-weight: 500;">Sign up here!</a>
            </p>

            <p class="text-center mt-4">
              Need to make a chef account? <a href="../high-fidelity-prototype/Provider/register.html"
                style="color: black; font-weight: 500;">Sign up here!</a>
            </p>
          </div>
        </div>
      </div>
    </section>


</body>
</html>
