<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="../styles.css">

    <title>Provider Sign Up - MealPrep Match</title>

</head>

<body>

    <div class="container">

        <!-- Navigation -->

        <nav>

            <div class="navbar">

                <a href="../index.html" class="navbar-brand">
                    MealPrep Match
                </a>

                <ul class="nav-links">

                    <li>
                        <a href="../index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="../login.html" class="btn btn-primary">
                            Login
                        </a>
                    </li>

                </ul>

            </div>

        </nav>


        <!-- Registration Section -->

        <section class="section">

            <div class="container" style="max-width: 600px;">

                <div class="card">

                    <div class="card-body">

                        <h2 class="text-center">
                            Become a Meal Provider
                        </h2>

                        <p class="text-center text-muted">
                            Register to offer your meals to MealPrep Match customers.
                        </p>


                        <!-- Personal Information -->

                        <h3>
                            Personal Information
                        </h3>

                        <div class="form-group">

                            <label for="firstName">
                                First Name
                            </label>

                            <input type="text" id="firstName" placeholder="John" required>

                        </div>


                        <div class="form-group">

                            <label for="lastName">
                                Last Name
                            </label>

                            <input type="text" id="lastName" placeholder="Smith" required>

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input type="email" id="email" placeholder="john@example.com" required>

                        </div>


                        <!-- Provider Information -->

                        <h3>
                            Provider Information
                        </h3>

                        <div class="form-group">

                            <label for="businessName">
                                Business or Provider Name
                            </label>

                            <input type="text" id="businessName" placeholder="Healthy Meals Kitchen" required>

                        </div>


                        <div class="form-group">

                            <label for="specialties">
                                Meal Specialties
                            </label>

                            <textarea id="specialties" placeholder="Example: High Protein, Vegan, Low Carb"
                                required></textarea>

                        </div>


                        <div class="form-group">

                            <label for="description">
                                About Your Meals
                            </label>

                            <textarea id="description" placeholder="Tell customers about the meals you provide..."
                                required></textarea>

                        </div>


                        <!-- Terms -->

                        <div class="form-group">

                            <label>

                                <input type="checkbox" required>

                                I agree to provide accurate information about my meals.

                            </label>

                        </div>


                        <!-- Register Button -->

                        <a href="dashboard.html" class="btn btn-primary register-button">

                            Register as Provider

                        </a>


                        <!-- Login -->

                        <p class="text-center login-text">

                            Already have an account?

                            <a href="../login.html">
                                Login here
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!-- Footer -->

        <footer>

            <p>
                &copy; 2026 MealPrep Match. All rights reserved.
            </p>

        </footer>

    </div>

</body>

</html>
